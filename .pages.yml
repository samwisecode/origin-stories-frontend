media:
  - name: speakers
    label: Speaker photos
    input: public/uploads/speakers
    output: /uploads/speakers
    categories: [image]
  - name: partners
    label: Partner logos
    input: public/uploads/partners
    output: /uploads/partners
    categories: [image]
  - name: companies
    label: Company logos
    input: public/uploads/companies
    output: /uploads/companies
    categories: [image]

content:
  - name: speakers
    label: Speakers
    type: collection
    path: content/speakers
    format: json
    filename: '{primary}.json'
    view:
      fields: [name, company, years, order]
      primary: name
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: photo
        label: Photo
        type: image
        required: true
        options:
          media: speakers
      - name: title
        label: Job title
        type: string
      - name: company
        label: Company
        type: string
      - name: companies
        label: Companies
        type: reference
        options:
          collection: companies
          multiple: true
          search: name
          value: '{path}'
          label: '{name}'
      - name: linkedInUrl
        label: LinkedIn URL
        type: string
      - name: bio
        label: Bio
        type: text
      - name: years
        label: Years
        type: number
        list: true
        required: true
        description: Each year this person spoke, e.g. 2025. Add a row per year.
      - name: order
        label: Display order
        type: number
        required: true
        description: Lower numbers show first.

  - name: partners
    label: Partners
    type: collection
    path: content/partners
    format: json
    filename: '{primary}.json'
    view:
      fields: [name, status, order]
      primary: name
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
        required: true
        options:
          media: partners
      - name: url
        label: Website
        type: string
      - name: description
        label: Description
        type: rich-text
        options:
          format: html
          media: false
      - name: status
        label: Status
        type: select
        required: true
        default: Current
        options:
          values: [Current, Past]
      - name: years
        label: Years
        type: number
        list: true
        required: true
        description: Each year this person spoke, e.g. 2025. Add a row per year.
      - name: order
        label: Display order
        type: number
        required: true
        description: Lower numbers show first.

  - name: companies
    label: Speaker Companies
    type: collection
    path: content/companies
    format: json
    filename: '{primary}.json'
    view:
      fields: [name, industry]
      primary: name
      sort: [name]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
        required: true
        options:
          media: companies
      - name: intro
        label: Short introduction
        type: text
      - name: industry
        label: Industry
        type: string
      - name: info
        label: Info
        type: rich-text
        options:
          format: html
          media: false
      - name: socials
        label: Social media links
        type: object
        list: true
        fields:
          - name: type
            label: Type
            type: select
            required: true
            options:
              values: [Website, LinkedIn, Instagram, Facebook, X, TikTok, YouTube]
          - name: url
            label: URL
            type: string
            required: true

  - name: about
    label: About page
    type: file
    path: content/pages/about.json
    format: json
    fields:
      - name: seoTitle
        label: SEO title
        type: string
        required: true
        description: Shown in the browser tab and search results.
      - name: seoDescription
        label: SEO description
        type: text
        required: true
        description: Shown under the title in search results.
      - name: heroHeading
        label: Hero heading
        type: string
        required: true
      - name: heroParagraphs
        label: Hero paragraphs
        type: text
        list: true
        description: One row per paragraph.
      - name: whyHeading
        label: "'Why' section heading"
        type: string
        required: true
      - name: whyHeadingAccent
        label: "'Why' section heading (gold words)"
        type: string
        description: Shown in gold straight after the heading.
      - name: whyPoints
        label: "'Why' section bullet points"
        type: text
        list: true
        description: One row per bullet point.
      - name: closingLine
        label: Closing line
        type: string
        description: Gold line under the bullet points.

  - name: home
    label: Home page
    type: file
    path: content/pages/home.json
    format: json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - name: tagline
            label: Tagline
            type: string
            required: true
          - name: eventDate
            label: Event date and time
            type: string
            required: true
          - name: venue
            label: Venue
            type: string
            required: true
          - name: ticketLabel
            label: Ticket button text
            type: string
            required: true
          - name: ticketUrl
            label: Ticket link
            type: string
            required: true
      - name: intro
        label: Intro paragraph
        type: object
        fields:
          - name: before
            label: Text before highlight
            type: string
          - name: highlight
            label: Highlighted text
            type: text
            required: true
            description: Shown with the brown marker behind it.
          - name: after
            label: Text after highlight
            type: text
      - name: origin
        label: Origin story
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
            description: One row per paragraph.
          - name: authorName
            label: Author name
            type: string
            required: true
          - name: authorRole
            label: Author role
            type: string
          - name: authorNote
            label: Small print under author
            type: string
      - name: about
        label: "'What is Origin Stories' section"
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: headingAccent
            label: Heading (gold words)
            type: string
            description: Shown in gold straight after the heading.
          - name: body
            label: Body
            type: rich-text
            description: Use a bullet list. Bold text is supported.
            options:
              format: html
              media: false
      - name: vision
        label: Vision section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: headingAccent
            label: Heading (gold words)
            type: string
            description: Shown in gold straight after the heading.
          - name: body
            label: Body
            type: rich-text
            options:
              format: html
              media: false
      - name: speakers
        label: Speakers section
        type: object
        fields:
          - name: headingAccent
            label: Heading (gold words)
            type: string
            required: true
            description: Shown in gold after the latest speaker year, e.g. "2026 Speakers".
      - name: partners
        label: Partners section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: headingAccent
            label: Heading (gold words)
            type: string
            description: Shown in gold straight after the heading.
          - name: buttonLabel
            label: Button text
            type: string
            required: true
      - name: contact
        label: Contact section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: headingAccent
            label: Heading (gold words)
            type: string
            description: Shown in gold straight after the heading.
          - name: intro
            label: Intro text
            type: text
          - name: successMessage
            label: Message sent text
            type: text
            required: true
          - name: errorMessage
            label: Message failed text
            type: text
            required: true

  - name: learnMore
    label: Learn More page
    type: file
    path: content/pages/learnmore.json
    format: json
    fields:
      - name: seoTitle
        label: SEO title
        type: string
        required: true
        description: Shown in the browser tab and search results.
      - name: seoDescription
        label: SEO description
        type: text
        required: true
        description: Shown under the title in search results.
      - name: heroHeading
        label: Hero heading
        type: string
        required: true
      - name: heroHeadingAccent
        label: Hero heading (gold words)
        type: string
        description: Shown in gold straight after the heading.
      - name: heroIntro
        label: Hero intro
        type: text
      - name: cards
        label: Link cards
        type: object
        list: true
        description: One row per card in the black section.
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
          - name: link
            label: Link
            type: string
            required: true
            description: A page on this site, e.g. /speakers, or a full URL.
      - name: watchHeading
        label: "'Watch' section heading"
        type: string
        required: true
      - name: watchHeadingAccent
        label: "'Watch' section heading (gold words)"
        type: string
        description: Shown in gold straight after the heading.
      - name: watchIntro
        label: "'Watch' section intro"
        type: text
      - name: watchButtonLabel
        label: "'Watch' button text"
        type: string
        required: true
      - name: watchButtonUrl
        label: "'Watch' button link"
        type: string
        required: true
