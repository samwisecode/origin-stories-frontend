media:
  - name: speakers
    label: Speaker photos
    input: public/uploads/speakers
    output: /uploads/speakers
    categories: [image]
  - name: partners
    label: Partner logos
    input: public/uploads/partners
    output: /uploads/partners
    categories: [image]
  - name: companies
    label: Company logos
    input: public/uploads/companies
    output: /uploads/companies
    categories: [image]

content:
  - name: speakers
    label: Speakers
    type: collection
    path: content/speakers
    format: json
    filename: '{primary}.json'
    view:
      fields: [name, company, years, order]
      primary: name
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: photo
        label: Photo
        type: image
        required: true
        options:
          media: speakers
      - name: title
        label: Job title
        type: string
      - name: company
        label: Company
        type: string
      - name: companies
        label: Companies
        type: reference
        options:
          collection: companies
          multiple: true
          search: name
          value: '{path}'
          label: '{name}'
      - name: linkedInUrl
        label: LinkedIn URL
        type: string
      - name: bio
        label: Bio
        type: text
      - name: years
        label: Years
        type: number
        list: true
        required: true
        description: Each year this person spoke, e.g. 2025. Add a row per year.
      - name: order
        label: Display order
        type: number
        required: true
        description: Lower numbers show first.

  - name: partners
    label: Partners
    type: collection
    path: content/partners
    format: json
    filename: '{primary}.json'
    view:
      fields: [name, status, order]
      primary: name
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
        required: true
        options:
          media: partners
      - name: url
        label: Website
        type: string
      - name: description
        label: Description
        type: rich-text
        options:
          format: html
          media: false
      - name: status
        label: Status
        type: select
        required: true
        default: Current
        options:
          values: [Current, Past]
      - name: years
        label: Years
        type: number
        list: true
        required: true
        description: Each year this person spoke, e.g. 2025. Add a row per year.
      - name: order
        label: Display order
        type: number
        required: true
        description: Lower numbers show first.

  - name: companies
    label: Companies
    type: collection
    path: content/companies
    format: json
    filename: '{primary}.json'
    view:
      fields: [name, industry]
      primary: name
      sort: [name]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
        required: true
        options:
          media: companies
      - name: intro
        label: Short introduction
        type: text
      - name: industry
        label: Industry
        type: string
      - name: info
        label: Info
        type: rich-text
        options:
          format: html
          media: false
      - name: socials
        label: Social media links
        type: object
        list: true
        fields:
          - name: type
            label: Type
            type: select
            required: true
            options:
              values: [Website, LinkedIn, Instagram, Facebook, X, TikTok, YouTube]
          - name: url
            label: URL
            type: string
            required: true
